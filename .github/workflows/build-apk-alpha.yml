name: Build Compose APK (Alpha)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码 (增加 fetch-depth: 0 确保版本信息正确)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 JDK 21 环境
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 3. 设置 Gradle (使用你已成功修改的最新版本)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 赋予构建脚本执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. 清理构建缓存
      - name: Clean
        run: ./gradlew clean

      # 6. 构建 Alpha 版本的 APK (文件名与路径较原版更精确)
      - name: Assemble alphaRelease
        run: ./gradlew :app:assembleAlphaRelease --stacktrace --info

      # ***** 以下是核心：新增的上传步骤 *****
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilibilias-alpha-apk
          path: app/build/outputs/apk/alpha/release/*.apk
          if-no-files-found: error
